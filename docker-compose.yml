---
services:
  python:
    build: python/.
    networks:
      - pgnc-network
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: "no"
    volumes:
      - ./python/output:/usr/src/app/output
      - ./python/bin/data-load:/usr/src/app/bin/data-load
    depends_on:
      pgncdb:
        condition: service_healthy
      solr:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for i in $(seq 1 10); do if [ -f /usr/src/app/output/done.flag ]; then exit 0; fi; sleep 1; done; exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
  solr-client:
    restart: on-failure
    build: solr-client/.
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_SOLR_CLIENT_PORT}:${SOLR_CLIENT_PORT}"
    environment:
      SOLR_HOST: ${SOLR_HOST}
      SOLR_PORT: ${SOLR_PORT}
      SOLR_CORE: ${SOLR_CORE}
    depends_on:
      solr:
        condition: service_healthy
      python:
        condition: service_completed_successfully
    volumes:
      - ./python/output:/usr/src/app/output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q 'http://localhost:3000/browse?q=pgnc:2&start=0&rows=1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  solr-data:
    build: solr-data/.
    container_name: solr-data
    restart: "no"
    networks:
      - pgnc-network
    volumes:
      - solr-data:/var/solr/cores
  solr:
    build: solr/.
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_SOLR_PORT}:${SOLR_PORT}"
    volumes:
      - solr-data:/var/solr/cores
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${SOLR_PORT}/solr/pgnc/select?q=*:*",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      - solr-data
  pgnc-data:
    build: db-data/.
    container_name: db-data
    restart: "no"
    networks:
      - pgnc-network
    volumes:
      - pgnc-data:/var/lib/postgresql/data
  pgncdb:
    image: docker.io/library/postgres:17.0
    container_name: pgncdb
    restart: always
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./db-data:/docker-entrypoint-initdb.d
      - pgnc-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME} && psql -U ${DB_USER} -d ${DB_NAME} -c 'SELECT 1 FROM init_completion'",
        ]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      - pgnc-data
  api:
    restart: always
    build: api/.
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_API_PORT}:${API_PORT}"
    environment:
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_SYNC: ${DB_SYNC}
      DB_AUTOLOAD_ENTITIES: ${DB_AUTOLOAD_ENTITIES}
      PROFILE_API_KEY: ${PROFILE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TOKEN_AUDIENCE: ${JWT_TOKEN_AUDIENCE}
      JWT_TOKEN_ISSUER: ${JWT_TOKEN_ISSUER}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      MAIL_HOST: ${MAIL_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      pgncdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O - -q http://localhost:${API_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  angular:
    restart: always
    build:
      context: angular/.
      dockerfile: Dockerfile
      args:
        - API_USER=${API_USER}
        - API_PASSWORD=${API_PASSWORD}
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_ANGULAR_PORT}:${ANGULAR_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:${ANGULAR_PORT} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  nginx:
    restart: always
    build: nginx/.
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_NGINX_PORT}:${NGINX_PORT}"
    depends_on:
      angular:
        condition: service_healthy
      solr-client:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:${NGINX_PORT}/api/health && wget --spider -q http://localhost:${NGINX_PORT}/ses/browse?q=&start=0&rows=1 && wget --spider -q http://localhost:${NGINX_PORT} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
networks:
  pgnc-network:
    driver: bridge
volumes:
  pgnc-data:
  solr-data:
