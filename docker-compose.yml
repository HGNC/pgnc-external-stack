---
services:
  python:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    image: local/pgnc-python
    pull_policy: never
    networks:
      - pgnc-network
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${DB_PASSWORD}
      SOLR_USERNAME: ${SOLR_ADMIN_USER}
      SOLR_PASSWORD: ${SOLR_ADMIN_PASSWORD}
      SOLR_HOST: ${SOLR_HOST}
      SOLR_PORT: ${SOLR_PORT}
    restart: on-failure:3
    volumes:
      - python-input:/usr/src/app/input
      - python-output:/usr/src/app/output
    depends_on:
      pgncdb:
        condition: service_healthy
      solr:
        condition: service_healthy
  solr-client:
    restart: on-failure
    image: ghcr.io/hgnc/pgnc-solr-client:latest
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_SOLR_CLIENT_PORT}:${SOLR_CLIENT_PORT}"
    environment:
      SOLR_HOST: ${SOLR_HOST}
      SOLR_PORT: ${SOLR_PORT}
      SOLR_CORE: ${SOLR_CORE}
    
      SOLR_USERNAME: ${SOLR_CLIENT_USER}
      SOLR_PASSWORD: ${SOLR_CLIENT_PASSWORD}
    depends_on:
      python:
        condition: service_completed_successfully
    volumes:
      - python-output:/usr/src/app/output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O /dev/null -q \"http://${SOLR_CLIENT_USER}:${SOLR_CLIENT_PASSWORD}@localhost:${SOLR_CLIENT_PORT}/browse?q=pgnc:2&start=0&rows=1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  solr:
    build:
      context: .
      dockerfile: docker/solr.Dockerfile
    image: local/pgnc-solr
    pull_policy: never
    shm_size: 256m
    networks:
      - pgnc-network
    environment:
      SOLR_PORT: ${SOLR_PORT}
      SOLR_OPTS: "-Dsolr.autoSoftCommit.maxTime=10000 -Dsolr.security.enabled=true -Dsolr.config.lib.enabled=true"
    ports:
      - "${LOCALHOST_SOLR_PORT}:${SOLR_PORT}"
    volumes:
      - solr-data:/var/solr/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --user ${SOLR_ADMIN_USER}:${SOLR_ADMIN_PASSWORD} http://localhost:8983/solr/admin/cores?action=STATUS"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
  pgncdb:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: local/pgnc-postgres
    pull_policy: never
    container_name: pgncdb
    restart: always
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgnc-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1 FROM init_completion'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  api:
    restart: always
    image: ghcr.io/hgnc/pgnc-api:latest
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_API_PORT}:${API_PORT}"
    environment:
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_SYNC: ${DB_SYNC}
      DB_AUTOLOAD_ENTITIES: ${DB_AUTOLOAD_ENTITIES}
      PROFILE_API_KEY: ${PROFILE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TOKEN_AUDIENCE: ${JWT_TOKEN_AUDIENCE}
      JWT_TOKEN_ISSUER: ${JWT_TOKEN_ISSUER}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      MAIL_HOST: ${MAIL_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      API_PORT: ${API_PORT}
    depends_on:
      pgncdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O /dev/null -q http://localhost:$${API_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  angular:
    image: ghcr.io/hgnc/pgnc-angular:latest
    restart: always
    networks:
      - pgnc-network
    environment:
      ANGULAR_PORT: ${ANGULAR_PORT}
      API_USER: ${API_USER}
      API_PASSWORD: ${API_PASSWORD}
    ports:
      - "${LOCALHOST_ANGULAR_PORT}:${ANGULAR_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O /dev/null -q http://localhost:$${ANGULAR_PORT} || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  certbot:
    image: ghcr.io/hgnc/pgnc-certbot:latest
    container_name: certbot
    profiles: ["ssl"]
    environment:
      # Google Cloud Authentication
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-key.json
      # Google Cloud Project Configuration
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_DNS_ZONE: ${GCP_DNS_ZONE}
      GCP_DNS_TTL: ${GCP_DNS_TTL:-300}
      GCP_DNS_PROPAGATION_WAIT: ${GCP_DNS_PROPAGATION_WAIT:-60}
      # Certbot Configuration
      CERTBOT_EMAIL: ${MY_EMAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      # Mount service account key (read-only)
      - ${GCP_KEY_FILE}:/app/gcp-key.json:ro
      # Mount certificate storage (read-write)
      - certbot-letsencrypt:/etc/letsencrypt
      - certbot-logs:/var/log/letsencrypt
    networks:
      - pgnc-network
    # Default command for certificate request
    # Override this command when running manually
    command: >
      certonly
      --dns-google
      --dns-google-credentials /app/gcp-key.json
      --dns-google-propagation-seconds ${GCP_DNS_PROPAGATION_WAIT:-60}
      --email ${MY_EMAIL}
      --agree-tos
      --no-eff-email
      --non-interactive
      --expand
      --domains ${DOMAIN_NAME}
      --domains pgnc.genenames.org
  nginx:
    restart: always
    image: ghcr.io/hgnc/pgnc-nginx:latest
    networks:
      - pgnc-network
    ports:
      - "${LOCALHOST_NGINX_PORT}:${NGINX_PORT}"
      - "${LOCALHOST_NGINX_SSL_PORT}:${NGINX_SSL_PORT}"
    environment:
      NGINX_PORT: ${NGINX_PORT}
      NGINX_SSL_PORT: ${NGINX_SSL_PORT}
    volumes:
      - certbot-letsencrypt:/etc/letsencrypt:ro
    depends_on:
      angular:
        condition: service_healthy
      solr-client:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -O /dev/null -q http://0.0.0.0:$${NGINX_PORT}/api/health && wget -O /dev/null -q \"http://0.0.0.0:$${NGINX_PORT}/ses/browse?q=pgnc:2&start=0&rows=1\" && wget -O /dev/null -q http://0.0.0.0:$${NGINX_PORT} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
networks:
  pgnc-network:
    driver: bridge
volumes:
  pgnc-data:
  certbot-etc:
  certbot-letsencrypt:
  certbot-logs:
  python-input:
  python-output:
  solr-data:
